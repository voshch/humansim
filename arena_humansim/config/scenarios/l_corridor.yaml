# l_corridor.yaml
# L-shaped corridor forcing a 90-degree turn. The corridor runs east along
# y in [-1.2, 1.2] until x = 4, then turns north along x in [2.8, 5.2].
# Agents travel from the south-west entry to the north exit and back.

name: l_corridor
description: >-
  Eight pedestrians navigate an L-shaped corridor with a right-angle turn.
  Four travel from the west entry up to the north exit; four travel the
  opposite direction. Tests global planner cornering and local avoidance at
  the inside corner.

simulation:
  seed: 19
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 6000
  execution_mode: master

modules:
  perception: default
  global_planner: dijkstra
  local_planner: sfm
  interaction_manager: default
  animation: kinematic

agents:
  # --- West entry -> North exit ---
  - agent_id: 0
    spawn_pose: {x: -8.0, y:  0.4, theta: 0.0}
    goal_sequence:
      - {x: 4.0, y:  0.0}
      - {x: 4.0, y: 10.0}
    desired_velocity: 1.2

  - agent_id: 1
    spawn_pose: {x: -8.0, y: -0.4, theta: 0.0}
    goal_sequence:
      - {x: 4.0, y:  0.0}
      - {x: 4.0, y: 10.0}
    desired_velocity: 1.25

  - agent_id: 2
    spawn_pose: {x: -7.0, y:  0.0, theta: 0.0}
    goal_sequence:
      - {x: 4.0, y:  0.0}
      - {x: 4.0, y: 10.0}
    desired_velocity: 1.15

  - agent_id: 3
    spawn_pose: {x: -9.0, y:  0.8, theta: 0.0}
    goal_sequence:
      - {x: 4.0, y:  0.0}
      - {x: 4.0, y: 10.0}
    desired_velocity: 1.3

  # --- North exit -> West entry ---
  - agent_id: 4
    spawn_pose: {x: 4.0, y: 10.0, theta: -1.5708}
    goal_sequence:
      - {x: 4.0, y:  0.0}
      - {x: -8.0, y:  0.0}
    desired_velocity: 1.2

  - agent_id: 5
    spawn_pose: {x: 3.5, y:  9.0, theta: -1.5708}
    goal_sequence:
      - {x: 4.0, y:  0.0}
      - {x: -8.0, y:  0.0}
    desired_velocity: 1.1

  - agent_id: 6
    spawn_pose: {x: 4.5, y:  9.0, theta: -1.5708}
    goal_sequence:
      - {x: 4.0, y:  0.0}
      - {x: -8.0, y:  0.0}
    desired_velocity: 1.25

  - agent_id: 7
    spawn_pose: {x: 4.0, y:  8.0, theta: -1.5708}
    goal_sequence:
      - {x: 4.0, y:  0.0}
      - {x: -8.0, y:  0.0}
    desired_velocity: 1.15

walls:
  # Outer (north/west) wall of the horizontal leg, continuing up the vertical leg
  - {name: outer_h,    start: {x: -10.0, y:  1.2}, end: {x:  2.8, y:  1.2}}
  - {name: outer_v,    start: {x:   2.8, y:  1.2}, end: {x:  2.8, y: 11.0}}
  # Inner (south/east) corner wall -- forms the inside of the L
  - {name: inner_h,    start: {x: -10.0, y: -1.2}, end: {x:  5.2, y: -1.2}}
  - {name: inner_v,    start: {x:   5.2, y: -1.2}, end: {x:  5.2, y: 11.0}}

interaction_scripts: []
