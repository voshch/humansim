name: go_to_waypoint
description: >-
  Single agent with a one-step go_to behavior tree targeting (5, 5).

simulation:
  seed: 42
  dt: 0.05
  bt_tick_interval: 1
  max_ticks: 1000
  execution_mode: master

modules:
  perception: default
  global_planner: dijkstra
  local_planner: sfm
  animation: kinematic

agent_types:
  go_to_walker:
    extends: adult
    mode: behavior_tree
    initial_sequence: walk
    sequences:
      walk:
        steps:
          to_corner:
            kind: go_to
            target_pose: {x: 5.0, y: 5.0}
            patience: {mean: 60.0, std: 0.0, clip_low: 60.0, clip_high: 60.0}

agents:
  - agent_id: 1
    agent_type: go_to_walker
    spawn_pose: {x: 0.0, y: 0.0, theta: 0.0}
    desired_velocity: 1.3

interaction_scripts: []
