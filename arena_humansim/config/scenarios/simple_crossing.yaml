# simple_crossing.yaml
# Four agents walking toward each other in a cross pattern.
# Agent 0 walks east, Agent 1 walks west, Agent 2 walks north, Agent 3 walks south.
# Agents 2 and 3 use the "elderly" agent type for slower movement.

name: simple_crossing
description: >-
  Four pedestrians approach an intersection from the four cardinal directions
  and must negotiate passage through a shared crossing point.  The north/south
  pair are elderly and move more slowly.

simulation:
  seed: 42
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 2000
  execution_mode: master

agent_types:
  tourist_group:
    desired_velocity: {mean: 0.9, std: 0.2}
    perception:
      vision_range: {mean: 4.0, std: 1.0}

agents:
  - agent_id: 0
    spawn_pose: {x: -10.0, y: 0.0, theta: 0.0}
    goal_sequence:
      - {x: 10.0, y: 0.0, theta: 0.0}
    desired_velocity: 1.3

  - agent_id: 1
    spawn_pose: {x: 10.0, y: 0.0, theta: 3.14159}
    goal_sequence:
      - {x: -10.0, y: 0.0, theta: 0.0}
    desired_velocity: 1.3

  - agent_id: 2
    agent_type: elderly
    spawn_pose: {x: 0.0, y: -10.0, theta: 1.5708}
    goal_sequence:
      - {x: 0.0, y: 10.0, theta: 0.0}
    desired_velocity: 0.8

  - agent_id: 3
    agent_type: elderly
    spawn_pose: {x: 0.0, y: 10.0, theta: -1.5708}
    goal_sequence:
      - {x: 0.0, y: -10.0, theta: 0.0}
    desired_velocity: 0.8

interaction_scripts: []
