name: generated_A_busy_office_where_workers_perform_tasks_and_take
description: A busy office where workers perform tasks and take breaks for food and water
simulation:
  seed: 42
  dt: 0.05
  bt_tick_interval: 5
  execution_mode: master
modules:
  perception: default
  global_planner: dijkstra
  local_planner: sfm
  animation: kinematic
agent_types:
  receptionist:
    name: receptionist
    mode: behavior_tree
    needs:
      hunger:
        initial:
          mean: 80.0
          std: 0.0
          clip_low: 0.01
          clip_high: 1000000000.0
        decay_rate:
          mean: 0.005
          std: 0.0
          clip_low: 0.01
          clip_high: 1000000000.0
      thirst:
        initial:
          mean: 80.0
          std: 0.0
          clip_low: 0.01
          clip_high: 1000000000.0
        decay_rate:
          mean: 0.008
          std: 0.0
          clip_low: 0.01
          clip_high: 1000000000.0
    sequences:
      work_at_desk:
        steps:
          sit_and_work:
            target: nurse_resting_desk_chair_1
            interaction: SIT_ON
            duration:
              mean: 300.0
              std: 50.0
              clip_low: 60.0
              clip_high: 600.0
            patience: null
            satisfies: {}
            on_failure: abort
            autonomous: false
            until: null
            until_need: null
            allowed_actions: null
            blocked_actions: null
            interruptible: true
            interaction_radius: null
            offer: false
            cancel: false
            queueable: null
            min_participants: null
            max_participants: null
            formation_spec: null
            wait_for_outcome: false
        then: null
        on_failure: null
        interruptible: true
        transitions:
        - when:
            hunger:
              below: 30.0
              above: null
          goto: go_eat
        - when:
            thirst:
              below: 30.0
              above: null
          goto: go_drink
      go_eat:
        steps:
          find_food:
            target: doctors_resting_room_sidetable_1
            interaction: USE
            duration:
              mean: 120.0
              std: 20.0
              clip_low: 60.0
              clip_high: 300.0
            patience: null
            satisfies:
              hunger: 50.0
            on_failure: abort
            autonomous: false
            until: null
            until_need: null
            allowed_actions: null
            blocked_actions: null
            interruptible: null
            interaction_radius: null
            offer: false
            cancel: false
            queueable: null
            min_participants: null
            max_participants: null
            formation_spec: null
            wait_for_outcome: false
        then: work_at_desk
        on_failure: null
        interruptible: true
        transitions: []
      go_drink:
        steps:
          find_water:
            target: doctors_resting_room_sidetable_1
            interaction: USE
            duration:
              mean: 30.0
              std: 5.0
              clip_low: 10.0
              clip_high: 60.0
            patience: null
            satisfies:
              thirst: 40.0
            on_failure: abort
            autonomous: false
            until: null
            until_need: null
            allowed_actions: null
            blocked_actions: null
            interruptible: null
            interaction_radius: null
            offer: false
            cancel: false
            queueable: null
            min_participants: null
            max_participants: null
            formation_spec: null
            wait_for_outcome: false
        then: work_at_desk
        on_failure: null
        interruptible: true
        transitions: []
    initial_sequence: work_at_desk
    vars:
      is_busy:
        type: bool
        default: true
        min: null
        max: null
