name: hospital_showcase
description: >-
  Use case 1 -Nurse escort: nurse agent advertises FOLLOW, patient accepts.
             Shared contract duration ensures coordinated teardown.
  Use case 2 -Doctor consultation: doctor and patient engage in TALK_TO with
             shared contract duration. Outcome propagates to behavior tree.
  Use case 3 -Reception queue: patients QUEUE_USE at reception desk.
             If a participant leaves, others see INTERRUPTED outcome.


simulation:
  seed: 11
  dt: 0.05
  bt_tick_interval: 5
  # max_ticks: 6000
  execution_mode: master
  formation_scale: 1.0

modules:
  perception: default
  global_planner: dijkstra
  local_planner: sfm
  animation: kinematic

agent_types:
  nurse:
    extends: adult
    mode: behavior_tree
    desired_velocity: {mean: 1.2, std: 0.1, clip_low: 0.8, clip_high: 1.6}
    perception:
      vision_range: {mean: 6.0, std: 0.5, clip_low: 3.0, clip_high: 10.0}
    local_planner_params:
      relaxation_time: {mean: 0.4, std: 0.05, clip_low: 0.2, clip_high: 0.8}
      repulsion_strength: {mean: 2.0, std: 0.2, clip_low: 0.5, clip_high: 4.0}
    needs:
      duty:
        initial: {mean: 30.0, std: 5.0, clip_low: 10.0, clip_high: 50.0}
        decay_rate: {mean: 1.0, std: 0.1}
    utility_weights:
      duty: 1.0
    sequences:
      leg_bed:
        steps:
          go:
            kind: go_to
            target: SM_HospitalBed_01b
            patience: {mean: 90.0, std: 15.0, clip_low: 45.0, clip_high: 180.0}
          offer:
            interaction: SERVICE
            target: nurse_escort
            offer: true
            min_participants: 2
            max_participants: 2
            queueable: false
            formation_spec: {type: line, anchor_kind: provider, params: {base_step: 0.8}}
            patience: {mean: 20.0, std: 5.0, clip_low: 10.0, clip_high: 45.0}
          ride:
            kind: go_to
            target: exam_chair_1
            patience: {mean: 90.0, std: 15.0, clip_low: 45.0, clip_high: 180.0}
          drop:
            cancel: true
            satisfies:
              duty: 40.0
        then: leg_exam
        on_failure: leg_exam
      leg_exam:
        steps:
          go:
            kind: go_to
            target: exam_chair_1
            patience: {mean: 90.0, std: 15.0, clip_low: 45.0, clip_high: 180.0}
          offer:
            interaction: SERVICE
            target: nurse_escort
            offer: true
            min_participants: 2
            max_participants: 2
            queueable: false
            formation_spec: {type: line, anchor_kind: provider, params: {base_step: 0.8}}
            patience: {mean: 20.0, std: 5.0, clip_low: 10.0, clip_high: 45.0}
          ride:
            kind: go_to
            target: SM_HospitalBed_01b
            patience: {mean: 90.0, std: 15.0, clip_low: 45.0, clip_high: 180.0}
          drop:
            cancel: true
            satisfies:
              duty: 40.0
        then: leg_bed
        on_failure: leg_bed
    initial_sequence: leg_bed

  escort_patient:
    mode: behavior_tree
    extends: elder
    desired_velocity: {mean: 0.9, std: 0.1, clip_low: 0.6, clip_high: 1.2}
    perception:
      vision_fov: {mean: 160.0, std: 15.0, clip_low: 90.0, clip_high: 270.0}
      vision_range: {mean: 5.0, std: 0.5, clip_low: 3.0, clip_high: 10.0}
    sequences:
      default:
        steps:
          go_to_bed:
            kind: go_to
            target: SM_HospitalBed_01b
            patience: {mean: 60.0, std: 15.0, clip_low: 30.0, clip_high: 120.0}
          wait_for_nurse:
            interaction: SERVICE
            target: nurse_escort
            wait_for_outcome: true
            patience: {mean: 180.0, std: 30.0, clip_low: 90.0, clip_high: 360.0}
          idle:
            duration: {mean: 5.0, std: 2.0, clip_low: 2.0, clip_high: 15.0}
        then: default
        on_failure: default
    initial_sequence: default
  
  doctor:
    mode: behavior_tree
    extends: adult
    desired_velocity: {mean: 1.2, std: 0.1, clip_low: 0.8, clip_high: 1.6}
    perception:
      vision_range: {mean: 6.0, std: 0.5, clip_low: 3.0, clip_high: 10.0}
    local_planner_params:
      relaxation_time: {mean: 0.4, std: 0.05, clip_low: 0.2, clip_high: 0.8}
      repulsion_strength: {mean: 2.0, std: 0.2, clip_low: 0.5, clip_high: 4.0}
    needs:
      rounds:
        initial: {mean: 40.0, std: 10.0, clip_low: 10.0, clip_high: 60.0}
        decay_rate: {mean: 0.6, std: 0.1}
    utility_weights:
      rounds: 1.0
    sequences:
      default:
        steps:
          walk_to_chair:
            kind: go_to
            target: exam_chair_1
            patience: {mean: 60.0, std: 15.0, clip_low: 30.0, clip_high: 120.0}
          consult:
            interaction: TALK_TO
            duration: {mean: 25.0, std: 5.0, clip_low: 10.0, clip_high: 45.0}
            patience: {mean: 180.0, std: 30.0, clip_low: 90.0, clip_high: 360.0}
            satisfies:
              rounds: 50.0
          rest:
            duration: {mean: 10.0, std: 3.0, clip_low: 5.0, clip_high: 20.0}
        then: default
        on_failure: default
    initial_sequence: default

  patient:
    mode: behavior_tree
    extends: elder
    desired_velocity: {mean: 0.9, std: 0.15, clip_low: 0.5, clip_high: 1.4}
    perception:
      vision_fov: {mean: 160.0, std: 15.0, clip_low: 90.0, clip_high: 270.0}
      vision_range: {mean: 5.0, std: 0.5, clip_low: 3.0, clip_high: 10.0}
    needs:
      checkin:
        initial: {mean: 20.0, std: 5.0, clip_low: 5.0, clip_high: 40.0}
        decay_rate: {mean: 0.8, std: 0.1}
      treatment:
        initial: {mean: 60.0, std: 10.0, clip_low: 30.0, clip_high: 80.0}
        decay_rate: {mean: 0.3, std: 0.05}
    utility_weights:
      checkin: 1.5
      treatment: 1.0
    sequences:
      default:
        steps:
          check_in:
            target: reception_counter_1
            interaction: QUEUE_USE
            duration: {mean: 15.0, std: 3.0, clip_low: 5.0, clip_high: 30.0}
            patience: {mean: 120.0, std: 20.0, clip_low: 60.0, clip_high: 300.0}
            satisfies:
              checkin: 80.0
          wait:
            duration: {mean: 20.0, std: 5.0, clip_low: 10.0, clip_high: 40.0}
          walk_to_chair:
            kind: go_to
            target: exam_chair_1
            patience: {mean: 90.0, std: 15.0, clip_low: 45.0, clip_high: 180.0}
          consult:
            interaction: TALK_TO
            duration: {mean: 25.0, std: 5.0, clip_low: 10.0, clip_high: 45.0}
            patience: {mean: 120.0, std: 20.0, clip_low: 60.0, clip_high: 240.0}
            satisfies:
              treatment: 60.0
        then: default
        on_failure: default
    initial_sequence: default

  queue_patient:
    mode: behavior_tree
    extends: elder
    desired_velocity: {mean: 0.9, std: 0.15, clip_low: 0.4, clip_high: 1.4}
    perception:
      vision_fov: {mean: 160.0, std: 15.0, clip_low: 90.0, clip_high: 270.0}
    needs:
      checkin:
        initial: {mean: 20.0, std: 5.0, clip_low: 5.0, clip_high: 40.0}
        decay_rate: {mean: 0.8, std: 0.1}
    utility_weights:
      checkin: 1.0
    sequences:
      default:
        steps:
          check_in:
            target: reception_counter_1
            interaction: QUEUE_USE
            duration: {mean: 15.0, std: 3.0, clip_low: 5.0, clip_high: 30.0}
            patience: {mean: 60.0, std: 10.0, clip_low: 30.0, clip_high: 120.0}
            satisfies:
              checkin: 80.0
          depart:
            duration: {mean: 30.0, std: 10.0, clip_low: 10.0, clip_high: 60.0}
        then: default
    initial_sequence: default

agents:
  # --- Use case 1: nurse escort ---
  - name: nurse_1
    model: female_adult_medical_01
    pose: central_hallway
    agent: {agent_type: nurse, desired_velocity: 1.5}
    waypoints:
      - patient_ward
      - central_hallway

  - name: escort_patient
    model: male_adult_construction_01
    pose: patient_ward
    agent: {agent_type: escort_patient, desired_velocity: 0.9}
    waypoints:
      - patient_ward

  # --- Use case 2: doctor consultation ---
  - name: doctor_1
    model: male_adult_medical_01
    pose: exam_room_1
    agent: {agent_type: doctor, desired_velocity: 1.4}
    waypoints:
      - exam_room_1
      - patient_ward
      - exam_room_1

  - name: consult_patient
    model: female_adult_business_02
    pose: waiting_area
    agent: {agent_type: patient.yaml, desired_velocity: 1.0}
    waypoints:
      - central_hallway
      - exam_room_1

  # --- Use case 3: reception queue ---
  - name: queue_patient_1
    model: male_adult_construction_02
    pose: {x: 9.5, y: 0.5}
    agent: {agent_type: queue_patient.yaml, desired_velocity: 1.1}
    waypoints:
      - {x: 4.0, y: 1.0}

  - name: queue_patient_2
    model: female_adult_business_02
    pose: {x: 10.0, y: 0.8}
    agent: {agent_type: queue_patient.yaml, desired_velocity: 0.9}
    waypoints:
      - {x: 4.0, y: 1.0}

  - name: queue_patient_3
    model: male_adult_construction_03
    pose: {x: 10.5, y: 0.5}
    agent: {agent_type: queue_patient.yaml, desired_velocity: 1.0}
    waypoints:
      - {x: 4.0, y: 1.0}

  # --- Background flow ---
  - name: doctor_2
    model: female_adult_medical_01
    pose: laboratory
    agent: {agent_type: adult, desired_velocity: 1.3}
    waypoints:
      - central_hallway
      - operating_room
      - central_hallway
      - laboratory

flow:
  sources:
    - pose: {x: 10.0, y: 0.7, theta: 0.0}
      shape: {type: circle, radius: 0.5}
      rate_profile:
        - {t: 0.0, rate: 0.1}
        - {t: 30.0, rate: 0.3}
      max_concurrent: 4
      max_total: 15
      agent_template:
        agent_type: adult
        desired_velocity_min: 1.0
        desired_velocity_max: 1.5
  sinks:
  - pose: {x: 6.4, y: 26.3, theta: 0.0}
    shape: {type: circle, radius: 0.5}
    capacity: 4

