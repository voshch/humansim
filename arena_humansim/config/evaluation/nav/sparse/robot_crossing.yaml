# nav/sparse/crossing + one robot traversing west-to-east through the conflict.

name: robot_nav_sparse_crossing
description: >-
  Free-flow 4-stream crossing with one robot moving west-to-east through the
  origin where the four streams conflict.

simulation:
  seed: 11
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 4000
  execution_mode: master
  robot_shutdown: true

flow:
  sources:
    - pose: {x: -12.0, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.5}
      rate_profile: [{t: 0.0, rate: 0.3}]
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 0, weight: 1.0}]

    - pose: {x: 12.0, y: 0.0, theta: 3.14159}
      shape: {type: circle, radius: 0.5}
      rate_profile: [{t: 0.0, rate: 0.3}]
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 1, weight: 1.0}]

    - pose: {x: 0.0, y: -12.0, theta: 1.5708}
      shape: {type: circle, radius: 0.5}
      rate_profile: [{t: 0.0, rate: 0.3}]
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 2, weight: 1.0}]

    - pose: {x: 0.0, y: 12.0, theta: -1.5708}
      shape: {type: circle, radius: 0.5}
      rate_profile: [{t: 0.0, rate: 0.3}]
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 3, weight: 1.0}]

  sinks:
    - {pose: {x:  13.0, y:  0.0, theta: 0.0}, shape: {type: circle, radius: 0.8}, absorption_radius: 0.8, capacity: -1}
    - {pose: {x: -13.0, y:  0.0, theta: 0.0}, shape: {type: circle, radius: 0.8}, absorption_radius: 0.8, capacity: -1}
    - {pose: {x:  0.0,  y:  13.0, theta: 0.0}, shape: {type: circle, radius: 0.8}, absorption_radius: 0.8, capacity: -1}
    - {pose: {x:  0.0,  y: -13.0, theta: 0.0}, shape: {type: circle, radius: 0.8}, absorption_radius: 0.8, capacity: -1}

agents:
  - agent_id: -1
    kind: 1
    policy: straight
    agent_type: robot
    spawn_pose: {x: -13.0, y: 0.0, theta: 0.0}
    goal_sequence: [{x: 13.0, y: 0.0}]

interaction_scripts: []
