# 4-stream orthogonal crossing under free-flow density.
# Sources and sinks at cardinal directions; sustained flow through origin.

name: nav_sparse_crossing
description: >-
  Free-flow 4-stream orthogonal crossing. ~24 concurrent agents distributed
  over a 24m x 24m area; density peaks near the origin (~0.4 ped/m^2 in the
  central zone) and tapers to LOS A elsewhere. Tests pairwise yielding under
  multi-direction conflict without sustained congestion.

simulation:
  seed: 11
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 4000
  execution_mode: master

flow:
  sources:
    - pose: {x: -12.0, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.5}
      rate_profile:
        - {t: 0.0, rate: 0.3}
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 0, weight: 1.0}]

    - pose: {x: 12.0, y: 0.0, theta: 3.14159}
      shape: {type: circle, radius: 0.5}
      rate_profile:
        - {t: 0.0, rate: 0.3}
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 1, weight: 1.0}]

    - pose: {x: 0.0, y: -12.0, theta: 1.5708}
      shape: {type: circle, radius: 0.5}
      rate_profile:
        - {t: 0.0, rate: 0.3}
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 2, weight: 1.0}]

    - pose: {x: 0.0, y: 12.0, theta: -1.5708}
      shape: {type: circle, radius: 0.5}
      rate_profile:
        - {t: 0.0, rate: 0.3}
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 3, weight: 1.0}]

  sinks:
    - pose: {x:  13.0, y:  0.0, theta: 0.0}
      shape: {type: circle, radius: 0.8}
      absorption_radius: 0.8
      capacity: -1
    - pose: {x: -13.0, y:  0.0, theta: 0.0}
      shape: {type: circle, radius: 0.8}
      absorption_radius: 0.8
      capacity: -1
    - pose: {x:  0.0,  y:  13.0, theta: 0.0}
      shape: {type: circle, radius: 0.8}
      absorption_radius: 0.8
      capacity: -1
    - pose: {x:  0.0,  y: -13.0, theta: 0.0}
      shape: {type: circle, radius: 0.8}
      absorption_radius: 0.8
      capacity: -1

interaction_scripts: []
