# nav/sparse/corridor + one robot traversing east through the bidirectional flow.

name: robot_nav_sparse_corridor
description: >-
  Free-flow bidirectional corridor with one robot moving west-to-east along
  the centerline, threading the bidirectional human flow.

simulation:
  seed: 7
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 4000
  execution_mode: master
  robot_shutdown: true

flow:
  sources:
    - pose: {x: -14.5, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.5}
      rate_profile:
        - {t: 0.0, rate: 0.4}
      max_concurrent: 8
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity:
          - {sink_idx: 0, weight: 1.0}

    - pose: {x: 14.5, y: 0.0, theta: 3.14159}
      shape: {type: circle, radius: 0.5}
      rate_profile:
        - {t: 0.0, rate: 0.4}
      max_concurrent: 8
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity:
          - {sink_idx: 1, weight: 1.0}

  sinks:
    - pose: {x: 15.0, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.8}
      absorption_radius: 0.8
      capacity: -1
    - pose: {x: -15.0, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.8}
      absorption_radius: 0.8
      capacity: -1

agents:
  - agent_id: -1
    kind: 1
    policy: straight
    agent_type: robot
    spawn_pose: {x: -15.0, y: 0.0, theta: 0.0}
    goal_sequence: [{x: 15.0, y: 0.0}]

walls:
  - {name: north, start: {x: -16.0, y:  1.2}, end: {x: 16.0, y:  1.2}}
  - {name: south, start: {x: -16.0, y: -1.2}, end: {x: 16.0, y: -1.2}}

interaction_scripts: []
