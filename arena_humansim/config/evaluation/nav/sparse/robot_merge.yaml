# nav/sparse/merge + one robot emerging from the south stub eastward.

name: robot_nav_sparse_merge
description: >-
  Free-flow T-junction with one robot entering from the south stub, merging
  into the eastbound corridor traffic.

simulation:
  seed: 23
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 4000
  execution_mode: master
  robot_shutdown: true

flow:
  sources:
    - pose: {x: -12.0, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.5}
      rate_profile: [{t: 0.0, rate: 0.3}]
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 0, weight: 1.0}]

    - pose: {x: 12.0, y: 0.0, theta: 3.14159}
      shape: {type: circle, radius: 0.5}
      rate_profile: [{t: 0.0, rate: 0.3}]
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 1, weight: 1.0}]

    - pose: {x: 0.0, y: -10.0, theta: 1.5708}
      shape: {type: circle, radius: 0.5}
      rate_profile: [{t: 0.0, rate: 0.25}]
      max_concurrent: 5
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity:
          - {sink_idx: 0, weight: 0.5}
          - {sink_idx: 1, weight: 0.5}

  sinks:
    - {pose: {x:  13.0, y: 0.0, theta: 0.0}, shape: {type: circle, radius: 0.8}, absorption_radius: 0.8, capacity: -1}
    - {pose: {x: -13.0, y: 0.0, theta: 0.0}, shape: {type: circle, radius: 0.8}, absorption_radius: 0.8, capacity: -1}

agents:
  - agent_id: -1
    kind: 1
    policy: straight
    agent_type: robot
    spawn_pose: {x: 0.0, y: -10.0, theta: 1.5708}
    goal_sequence:
      - {x: 0.0, y: 0.0}
      - {x: 13.0, y: 0.0}

walls:
  - {name: north, start: {x: -13.0, y:  1.2}, end: {x: 13.0, y:  1.2}}
  - {name: south_w, start: {x: -13.0, y: -1.2}, end: {x: -1.2, y: -1.2}}
  - {name: south_e, start: {x:  1.2, y: -1.2}, end: {x: 13.0, y: -1.2}}
  - {name: stub_w, start: {x: -1.2, y: -1.2}, end: {x: -1.2, y: -10.5}}
  - {name: stub_e, start: {x:  1.2, y: -1.2}, end: {x:  1.2, y: -10.5}}

interaction_scripts: []
