# L-corridor: horizontal segment along yin[-1.2, 1.2] until x~3, then turns
# north along xin[2.8, 5.2]. Two opposing flows traverse the bend.

name: nav_sparse_bend
description: >-
  Free-flow L-corridor with a 90deg turn. One stream enters from the west and
  exits north; the other enters from the north and exits west. Steady-state
  ~0.21 ped/m^2 (Fruin LOS A). Tests cornering and inside-corner avoidance.

simulation:
  seed: 19
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 5000
  execution_mode: master

flow:
  sources:
    - pose: {x: -8.0, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.5}
      rate_profile: [{t: 0.0, rate: 0.3}]
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 0, weight: 1.0}]

    - pose: {x: 4.0, y: 9.0, theta: -1.5708}
      shape: {type: circle, radius: 0.5}
      rate_profile: [{t: 0.0, rate: 0.3}]
      max_concurrent: 6
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 1, weight: 1.0}]

  sinks:
    - {pose: {x: 4.0, y: 10.0, theta: 0.0}, shape: {type: circle, radius: 0.8}, absorption_radius: 0.8, capacity: -1}
    - {pose: {x: -9.0, y: 0.0, theta: 0.0}, shape: {type: circle, radius: 0.8}, absorption_radius: 0.8, capacity: -1}

walls:
  - {name: south,   start: {x: -9.0, y: -1.2}, end: {x:  5.2, y: -1.2}}
  - {name: east,    start: {x:  5.2, y: -1.2}, end: {x:  5.2, y: 10.5}}
  - {name: north_h, start: {x: -9.0, y:  1.2}, end: {x:  2.8, y:  1.2}}
  - {name: inner_v, start: {x:  2.8, y:  1.2}, end: {x:  2.8, y: 10.5}}

interaction_scripts: []
