# Two-room scenario with a 1.2m doorway. Sustained source/sink flow on each
# side keeps a queue forming at the door.

name: nav_dense_bottleneck
description: >-
  Congested two-room funnel through a 1.2m doorway. Sustained sources on each
  side keep agents queueing at the door (~1.0 ped/m^2 peak). Tests
  faster-is-slower and clogging behavior under counterflow.

simulation:
  seed: 53
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 8000
  execution_mode: master

flow:
  sources:
    - pose: {x: -8.0, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 1.0}]
      max_concurrent: 20
      max_total: -1
      agent_template:
        desired_velocity_min: 1.1
        desired_velocity_max: 1.4
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 0, weight: 1.0}]

    - pose: {x: 8.0, y: 0.0, theta: 3.14159}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 1.0}]
      max_concurrent: 20
      max_total: -1
      agent_template:
        desired_velocity_min: 1.1
        desired_velocity_max: 1.4
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 1, weight: 1.0}]

  sinks:
    - {pose: {x:  9.0, y: 0.0, theta: 0.0}, shape: {type: circle, radius: 1.0}, absorption_radius: 1.0, capacity: -1}
    - {pose: {x: -9.0, y: 0.0, theta: 0.0}, shape: {type: circle, radius: 1.0}, absorption_radius: 1.0, capacity: -1}

walls:
  - {name: north,     start: {x: -10.0, y:  5.0}, end: {x: 10.0, y:  5.0}}
  - {name: south,     start: {x: -10.0, y: -5.0}, end: {x: 10.0, y: -5.0}}
  - {name: west,      start: {x: -10.0, y: -5.0}, end: {x: -10.0, y:  5.0}}
  - {name: east,      start: {x:  10.0, y: -5.0}, end: {x:  10.0, y:  5.0}}
  - {name: divider_n, start: {x:   0.0, y:  0.6}, end: {x:   0.0, y:  5.0}}
  - {name: divider_s, start: {x:   0.0, y: -0.6}, end: {x:   0.0, y: -5.0}}

interaction_scripts: []
