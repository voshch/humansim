# nav/dense/flow + one robot crossing the dense flow orthogonally.

name: robot_nav_dense_flow
description: >-
  Congested open-space flow with one robot crossing the source-sink axis
  perpendicular to the dense human flow.

simulation:
  seed: 61
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 6000
  execution_mode: master
  robot_shutdown: true

flow:
  sources:
    - pose: {x: -8.0, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 1.0}
      rate_profile: [{t: 0.0, rate: 2.5}]
      max_concurrent: 60
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 0, weight: 1.0}]

  sinks:
    - {pose: {x: 8.0, y: 0.0, theta: 0.0}, shape: {type: circle, radius: 1.2}, absorption_radius: 1.2, capacity: -1}

agents:
  - agent_id: -1
    kind: 1
    policy: straight
    agent_type: robot
    spawn_pose: {x: 0.0, y: -7.0, theta: 1.5708}
    goal_sequence: [{x: 0.0, y: 7.0}]

interaction_scripts: []
