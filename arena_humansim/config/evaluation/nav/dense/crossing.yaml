# 4-stream orthogonal crossing under congested density.

name: nav_dense_crossing
description: >-
  Congested 4-stream orthogonal crossing. ~100 concurrent agents, density
  peaks ~0.8-1.0 ped/m^2 in the central conflict zone (Fruin LOS D) and
  tapers toward the cardinals. Sustained high-rate sources at all four
  cardinals exercise multi-direction conflict under load.

simulation:
  seed: 43
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 6000
  execution_mode: master

flow:
  sources:
    - pose: {x: -12.0, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 1.2}]
      max_concurrent: 25
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 0, weight: 1.0}]

    - pose: {x: 12.0, y: 0.0, theta: 3.14159}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 1.2}]
      max_concurrent: 25
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 1, weight: 1.0}]

    - pose: {x: 0.0, y: -12.0, theta: 1.5708}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 1.2}]
      max_concurrent: 25
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 2, weight: 1.0}]

    - pose: {x: 0.0, y: 12.0, theta: -1.5708}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 1.2}]
      max_concurrent: 25
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 3, weight: 1.0}]

  sinks:
    - {pose: {x:  13.0, y:  0.0, theta: 0.0}, shape: {type: circle, radius: 1.0}, absorption_radius: 1.0, capacity: -1}
    - {pose: {x: -13.0, y:  0.0, theta: 0.0}, shape: {type: circle, radius: 1.0}, absorption_radius: 1.0, capacity: -1}
    - {pose: {x:  0.0,  y:  13.0, theta: 0.0}, shape: {type: circle, radius: 1.0}, absorption_radius: 1.0, capacity: -1}
    - {pose: {x:  0.0,  y: -13.0, theta: 0.0}, shape: {type: circle, radius: 1.0}, absorption_radius: 1.0, capacity: -1}

interaction_scripts: []
