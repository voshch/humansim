# Long bidirectional corridor under congested density.

name: nav_dense_corridor
description: >-
  Congested counterflow corridor. 50m x 2.4m bounded by walls; opposing
  source/sink pairs sustained at high rate. Steady-state ~0.83 ped/m^2
  (100 concurrent, cap-limited; Fruin LOS D). Stresses lane formation and
  counterflow resolution under load.

simulation:
  seed: 41
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 8000
  execution_mode: master

flow:
  sources:
    - pose: {x: -24.5, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 1.8}]
      max_concurrent: 50
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 0, weight: 1.0}]

    - pose: {x: 24.5, y: 0.0, theta: 3.14159}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 1.8}]
      max_concurrent: 50
      max_total: -1
      agent_template:
        desired_velocity_min: 1.0
        desired_velocity_max: 1.3
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 1, weight: 1.0}]

  sinks:
    - {pose: {x:  25.0, y: 0.0, theta: 0.0}, shape: {type: circle, radius: 1.0}, absorption_radius: 1.0, capacity: -1}
    - {pose: {x: -25.0, y: 0.0, theta: 0.0}, shape: {type: circle, radius: 1.0}, absorption_radius: 1.0, capacity: -1}

walls:
  - {name: north, start: {x: -26.0, y:  1.2}, end: {x: 26.0, y:  1.2}}
  - {name: south, start: {x: -26.0, y: -1.2}, end: {x: 26.0, y: -1.2}}

interaction_scripts: []
