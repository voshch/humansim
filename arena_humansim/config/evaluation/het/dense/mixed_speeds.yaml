# Counterflow corridor with mixed adult/elder walking speeds.

name: het_dense_mixed_speeds
description: >-
  Heterogeneous counterflow corridor. 50m x 2.4m bounded by walls; each side
  emits a fast adult stream and a slower elder stream. Tests overtaking and
  lane formation under speed heterogeneity. Robot threads the corridor.

simulation:
  seed: 131
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 8000
  execution_mode: master
  robot_shutdown: true

flow:
  sources:
    - pose: {x: -24.5, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 1.0}]
      max_concurrent: 30
      max_total: -1
      agent_template:
        desired_velocity_min: 1.1
        desired_velocity_max: 1.4
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 0, weight: 1.0}]

    - pose: {x: -24.5, y: 0.0, theta: 0.0}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 0.5}]
      max_concurrent: 15
      max_total: -1
      agent_template:
        desired_velocity_min: 0.6
        desired_velocity_max: 0.9
        agent_radius: 0.25
        agent_type: elder
        sink_affinity: [{sink_idx: 0, weight: 1.0}]

    - pose: {x: 24.5, y: 0.0, theta: 3.14159}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 1.0}]
      max_concurrent: 30
      max_total: -1
      agent_template:
        desired_velocity_min: 1.1
        desired_velocity_max: 1.4
        agent_radius: 0.25
        agent_type: adult
        sink_affinity: [{sink_idx: 1, weight: 1.0}]

    - pose: {x: 24.5, y: 0.0, theta: 3.14159}
      shape: {type: circle, radius: 0.8}
      rate_profile: [{t: 0.0, rate: 0.5}]
      max_concurrent: 15
      max_total: -1
      agent_template:
        desired_velocity_min: 0.6
        desired_velocity_max: 0.9
        agent_radius: 0.25
        agent_type: elder
        sink_affinity: [{sink_idx: 1, weight: 1.0}]

  sinks:
    - {pose: {x:  25.0, y: 0.0, theta: 0.0}, shape: {type: circle, radius: 1.0}, absorption_radius: 1.0, capacity: -1}
    - {pose: {x: -25.0, y: 0.0, theta: 0.0}, shape: {type: circle, radius: 1.0}, absorption_radius: 1.0, capacity: -1}

walls:
  - {name: north, start: {x: -26.0, y:  1.2}, end: {x: 26.0, y:  1.2}}
  - {name: south, start: {x: -26.0, y: -1.2}, end: {x: 26.0, y: -1.2}}

agents:
  - agent_id: -1
    kind: 1
    agent_type: robot
    policy: straight
    spawn_pose: {x: -25.0, y: 0.0, theta: 0.0}
    goal_sequence:
      - {x: 25.0, y: 0.0}

interaction_scripts: []
