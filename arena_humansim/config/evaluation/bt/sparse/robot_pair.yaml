# bt/sparse/pair + one robot passing through the point where the pairs' routes cross.

name: robot_bt_sparse_pair
description: >-
  Two TALK_TO pairs swapping meeting spots, with a robot passing west-to-east
  through the origin where their routes cross.

simulation:
  seed: 83
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 4000
  execution_mode: master
  robot_shutdown: true

agent_types:
  talker_1:
    extends: adult
    mode: behavior_tree
    desired_velocity: {mean: 1.0, std: 0.1, clip_low: 0.7, clip_high: 1.3}
    initial_sequence: chat
    sequences:
      chat:
        steps:
          walk_a: {kind: go_to, target_pose: {x: -3.6, y: 2.0}}
          talk_a:
            interaction: TALK_TO
            duration: {mean: 10.0, std: 3.0, clip_low: 6.0, clip_high: 15.0}
            patience: {mean: 30.0, std: 5.0, clip_low: 20.0, clip_high: 45.0}
          walk_b: {kind: go_to, target_pose: {x: 2.4, y: -2.0}}
          talk_b:
            interaction: TALK_TO
            duration: {mean: 10.0, std: 3.0, clip_low: 6.0, clip_high: 15.0}
            patience: {mean: 30.0, std: 5.0, clip_low: 20.0, clip_high: 45.0}
        then: chat
  talker_2:
    extends: adult
    mode: behavior_tree
    desired_velocity: {mean: 1.0, std: 0.1, clip_low: 0.7, clip_high: 1.3}
    initial_sequence: chat
    sequences:
      chat:
        steps:
          walk_a: {kind: go_to, target_pose: {x: -2.4, y: 2.0}}
          talk_a:
            interaction: TALK_TO
            duration: {mean: 10.0, std: 3.0, clip_low: 6.0, clip_high: 15.0}
            patience: {mean: 30.0, std: 5.0, clip_low: 20.0, clip_high: 45.0}
          walk_b: {kind: go_to, target_pose: {x: 3.6, y: -2.0}}
          talk_b:
            interaction: TALK_TO
            duration: {mean: 10.0, std: 3.0, clip_low: 6.0, clip_high: 15.0}
            patience: {mean: 30.0, std: 5.0, clip_low: 20.0, clip_high: 45.0}
        then: chat
  talker_3:
    extends: adult
    mode: behavior_tree
    desired_velocity: {mean: 1.0, std: 0.1, clip_low: 0.7, clip_high: 1.3}
    initial_sequence: chat
    sequences:
      chat:
        steps:
          walk_a: {kind: go_to, target_pose: {x: 2.4, y: -2.0}}
          talk_a:
            interaction: TALK_TO
            duration: {mean: 10.0, std: 3.0, clip_low: 6.0, clip_high: 15.0}
            patience: {mean: 30.0, std: 5.0, clip_low: 20.0, clip_high: 45.0}
          walk_b: {kind: go_to, target_pose: {x: -3.6, y: 2.0}}
          talk_b:
            interaction: TALK_TO
            duration: {mean: 10.0, std: 3.0, clip_low: 6.0, clip_high: 15.0}
            patience: {mean: 30.0, std: 5.0, clip_low: 20.0, clip_high: 45.0}
        then: chat
  talker_4:
    extends: adult
    mode: behavior_tree
    desired_velocity: {mean: 1.0, std: 0.1, clip_low: 0.7, clip_high: 1.3}
    initial_sequence: chat
    sequences:
      chat:
        steps:
          walk_a: {kind: go_to, target_pose: {x: 3.6, y: -2.0}}
          talk_a:
            interaction: TALK_TO
            duration: {mean: 10.0, std: 3.0, clip_low: 6.0, clip_high: 15.0}
            patience: {mean: 30.0, std: 5.0, clip_low: 20.0, clip_high: 45.0}
          walk_b: {kind: go_to, target_pose: {x: -2.4, y: 2.0}}
          talk_b:
            interaction: TALK_TO
            duration: {mean: 10.0, std: 3.0, clip_low: 6.0, clip_high: 15.0}
            patience: {mean: 30.0, std: 5.0, clip_low: 20.0, clip_high: 45.0}
        then: chat

agents:
  - {agent_id: 1, agent_type: talker_1, spawn_pose: {x:  4.5, y: -3.0, theta: 2.55}}
  - {agent_id: 2, agent_type: talker_2, spawn_pose: {x:  5.3, y: -3.55, theta: 2.55}}
  - {agent_id: 3, agent_type: talker_3, spawn_pose: {x: -4.5, y:  3.0, theta: -0.59}}
  - {agent_id: 4, agent_type: talker_4, spawn_pose: {x: -5.3, y:  3.55, theta: -0.59}}
  - agent_id: -1
    kind: 1
    policy: straight
    agent_type: robot
    spawn_pose: {x: -6.0, y: 0.0, theta: 0.0}
    goal_sequence: [{x: 6.0, y: 0.0}]

interaction_scripts: []
