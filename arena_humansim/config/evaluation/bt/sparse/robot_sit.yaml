# bt/sparse/sit + one robot passing between the two benches.

name: robot_bt_sparse_sit
description: >-
  Two benches with seekers; a robot passes east-to-west across the bench
  axis, threading agents walking to and from rest.

simulation:
  seed: 89
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 4000
  execution_mode: master
  robot_shutdown: true

world_objects:
  - object_id: bench_a
    type: bench
    pose: {x: -3.0, y: 0.0, theta: 0.0}
    capacity: 2
    satisfies: {rest: 60.0}
  - object_id: bench_b
    type: bench
    pose: {x:  3.0, y: 0.0, theta: 3.14159}
    capacity: 2
    satisfies: {rest: 60.0}

agent_types:
  rester:
    extends: adult
    mode: behavior_tree
    desired_velocity: {mean: 0.9, std: 0.15, clip_low: 0.5, clip_high: 1.3}
    needs:
      rest:
        initial: {mean: 30.0, std: 10.0, clip_low: 5.0, clip_high: 60.0}
        decay_rate: {mean: 1.0, std: 0.2, clip_low: 0.3, clip_high: 2.0}
    utility_weights:
      rest: 1.0
    actions:
      rest_at_bench:
        target: bench
        duration: {mean: 8.0, std: 2.0, clip_low: 4.0, clip_high: 20.0}
        satisfies: {rest: 60.0}
        interaction: SIT_ON
    initial_sequence: stroll
    sequences:
      stroll:
        steps:
          pick:
            autonomous: true
            duration: {mean: 1.0, std: 0.5, clip_low: 0.5, clip_high: 3.0}
            allowed_actions: [rest_at_bench]
        then: stroll

agents:
  - {agent_id: 1, agent_type: rester, spawn_pose: {x: -6.0, y:  3.0, theta: 0.0}}
  - {agent_id: 2, agent_type: rester, spawn_pose: {x: -6.0, y: -3.0, theta: 0.0}}
  - {agent_id: 3, agent_type: rester, spawn_pose: {x:  0.0, y:  4.0, theta: -1.5708}}
  - {agent_id: 4, agent_type: rester, spawn_pose: {x:  0.0, y: -4.0, theta:  1.5708}}
  - {agent_id: 5, agent_type: rester, spawn_pose: {x:  6.0, y:  3.0, theta: 3.14159}}
  - {agent_id: 6, agent_type: rester, spawn_pose: {x:  6.0, y: -3.0, theta: 3.14159}}
  - agent_id: -1
    kind: 1
    policy: straight
    agent_type: robot
    spawn_pose: {x: -7.0, y: 1.0, theta: 0.0}
    goal_sequence: [{x: 7.0, y: 1.0}]

interaction_scripts: []
