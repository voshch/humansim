# Three concurrent F-formations with a robot threading through all of them.

name: robot_bt_dense_group_conversation
description: >-
  Three F-formations of 6 colleagues each at separate gathering areas along
  the x-axis. A robot crosses west-to-east through all three groups.

simulation:
  seed: 109
  dt: 0.05
  bt_tick_interval: 5
  max_ticks: 6000
  execution_mode: master
  robot_shutdown: true

world_objects:
  - object_id: ga_left
    type: gathering_area
    pose: {x: -8.0, y: 0.0, theta: 0.0}
    capacity: 0
    formation:
      type: f_formation
      anchor: {kind: object, ref: ga_left}
      params: {base_radius: 0.8, radius_per_member: 0.12}
  - object_id: ga_center
    type: gathering_area
    pose: {x: 0.0, y: 0.0, theta: 0.0}
    capacity: 0
    formation:
      type: f_formation
      anchor: {kind: object, ref: ga_center}
      params: {base_radius: 0.8, radius_per_member: 0.12}
  - object_id: ga_right
    type: gathering_area
    pose: {x: 8.0, y: 0.0, theta: 0.0}
    capacity: 0
    formation:
      type: f_formation
      anchor: {kind: object, ref: ga_right}
      params: {base_radius: 0.8, radius_per_member: 0.12}

agent_types:
  colleague_left:
    extends: adult
    mode: behavior_tree
    desired_velocity: {mean: 1.0, std: 0.15, clip_low: 0.6, clip_high: 1.4}
    initial_sequence: chat
    sequences:
      chat:
        steps:
          walk_in: {kind: go_to, target: ga_left}
          hold:
            interaction: GROUP_CONVERSATION
            duration: {mean: 60.0, std: 15.0, clip_low: 30.0, clip_high: 120.0}
            patience: {mean: 60.0, std: 10.0, clip_low: 30.0, clip_high: 120.0}
        then: chat
  colleague_center:
    extends: adult
    mode: behavior_tree
    desired_velocity: {mean: 1.0, std: 0.15, clip_low: 0.6, clip_high: 1.4}
    initial_sequence: chat
    sequences:
      chat:
        steps:
          walk_in: {kind: go_to, target: ga_center}
          hold:
            interaction: GROUP_CONVERSATION
            duration: {mean: 60.0, std: 15.0, clip_low: 30.0, clip_high: 120.0}
            patience: {mean: 60.0, std: 10.0, clip_low: 30.0, clip_high: 120.0}
        then: chat
  colleague_right:
    extends: adult
    mode: behavior_tree
    desired_velocity: {mean: 1.0, std: 0.15, clip_low: 0.6, clip_high: 1.4}
    initial_sequence: chat
    sequences:
      chat:
        steps:
          walk_in: {kind: go_to, target: ga_right}
          hold:
            interaction: GROUP_CONVERSATION
            duration: {mean: 60.0, std: 15.0, clip_low: 30.0, clip_high: 120.0}
            patience: {mean: 60.0, std: 10.0, clip_low: 30.0, clip_high: 120.0}
        then: chat

agents:
  - {agent_id: 1, agent_type: colleague_left, spawn_pose: {x: -10.0, y: -2.0, theta: 0.0}}
  - {agent_id: 2, agent_type: colleague_left, spawn_pose: {x: -10.0, y:  2.0, theta: 0.0}}
  - {agent_id: 3, agent_type: colleague_left, spawn_pose: {x:  -6.0, y: -2.0, theta: 3.14159}}
  - {agent_id: 4, agent_type: colleague_left, spawn_pose: {x:  -6.0, y:  2.0, theta: 3.14159}}
  - {agent_id: 5, agent_type: colleague_left, spawn_pose: {x:  -8.0, y: -3.0, theta:  1.5708}}
  - {agent_id: 6, agent_type: colleague_left, spawn_pose: {x:  -8.0, y:  3.0, theta: -1.5708}}
  - {agent_id: 11, agent_type: colleague_center, spawn_pose: {x: -2.0, y: -2.0, theta: 0.0}}
  - {agent_id: 12, agent_type: colleague_center, spawn_pose: {x: -2.0, y:  2.0, theta: 0.0}}
  - {agent_id: 13, agent_type: colleague_center, spawn_pose: {x:  2.0, y: -2.0, theta: 3.14159}}
  - {agent_id: 14, agent_type: colleague_center, spawn_pose: {x:  2.0, y:  2.0, theta: 3.14159}}
  - {agent_id: 15, agent_type: colleague_center, spawn_pose: {x:  0.0, y: -3.0, theta:  1.5708}}
  - {agent_id: 16, agent_type: colleague_center, spawn_pose: {x:  0.0, y:  3.0, theta: -1.5708}}
  - {agent_id: 21, agent_type: colleague_right, spawn_pose: {x:  6.0, y: -2.0, theta: 0.0}}
  - {agent_id: 22, agent_type: colleague_right, spawn_pose: {x:  6.0, y:  2.0, theta: 0.0}}
  - {agent_id: 23, agent_type: colleague_right, spawn_pose: {x: 10.0, y: -2.0, theta: 3.14159}}
  - {agent_id: 24, agent_type: colleague_right, spawn_pose: {x: 10.0, y:  2.0, theta: 3.14159}}
  - {agent_id: 25, agent_type: colleague_right, spawn_pose: {x:  8.0, y: -3.0, theta:  1.5708}}
  - {agent_id: 26, agent_type: colleague_right, spawn_pose: {x:  8.0, y:  3.0, theta: -1.5708}}
  - {agent_id: -1, kind: 1, agent_type: robot, policy: straight, spawn_pose: {x: -12.0, y: 0.0, theta: 0.0}, goal_sequence: [{x: 12.0, y: 0.0}]}

interaction_scripts: []
