# Exhausted walker (Kimodo, text only): slumped shoulders, head hanging, arms limp.
# Gait: profile walk_tired (arena_runtime human profiles), fitted from the retargeted Kimodo clip
# tired; speed/lateral harmonics measured on the clip's root track.
name: tired
extends: adult

desired_velocity: {mean: 0.75, std: 0.05, clip_low: 0.55, clip_high: 0.9}
max_velocity: {mean: 1.0, std: 0.05, clip_low: 0.8, clip_high: 1.2}
perception:
  vision_fov: {mean: 120.0, std: 10.0, clip_low: 80.0, clip_high: 160.0}

locomotion:
  cadence: {base: 0.4, per_speed: 0.5260, min: 0.4, max: 2.2}
  phase_warp: {split: 0.5}
  speed_profile:
    harmonics: [[0.02, 0.98], [0.076, -2.24]]
  lateral_profile:
    harmonics: [[0.147, -0.5], [0.017, -1.61]]

pose:
  walk: {base: walk_tired}
  run: {same_as: walk}
