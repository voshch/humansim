# Obese walker (Kimodo, text only): wide waddling stance, arms held out from the body. The mesh keeps average proportions, only the gait and the radius are wider.
# Gait: profile walk_obese (arena_runtime human profiles), fitted from the retargeted Kimodo clip
# obese; speed/lateral harmonics measured on the clip's root track.
name: obese
extends: adult

desired_velocity: {mean: 0.85, std: 0.06, clip_low: 0.6, clip_high: 1.0}
max_velocity: {mean: 1.1, std: 0.05, clip_low: 0.9, clip_high: 1.3}
agent_radius: {mean: 0.34, std: 0.02, clip_low: 0.28, clip_high: 0.42}
max_acceleration: {mean: 0.9, std: 0.1, clip_low: 0.4, clip_high: 1.5}

locomotion:
  cadence: {base: 0.4, per_speed: 0.3567, min: 0.4, max: 2.2}
  phase_warp: {split: 0.4138}
  speed_profile:
    harmonics: [[0.009, -1.78], [0.162, -2.29]]
  lateral_profile:
    harmonics: [[0.151, -0.25], [0.024, 1.92]]

pose:
  walk: {base: walk_obese}
  run: {same_as: walk}
