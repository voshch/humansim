# Frail elderly person with a pick-up walking frame (Zimmer / Bion style, no wheels), three-point gait: lift the frame
# and set it down ahead, step in with the weaker right leg, bring the left beside it, pause (Kimodo, both hands pinned to
# the frame handles, both feet pinned around their step slots). Nearly stops while the frame moves.
# Gait: profile walk_walkingframe (arena_runtime human profiles), fitted from the retargeted Kimodo clip
# walkingframe (cycle 1.9 s, 0.32 m per cycle); speed/lateral harmonics measured on the clip's root track.
# Footprint: a 0.95 m capsule along the heading covers the body and the frame ahead of it (frame 0.58 m wide).
name: patient_walking_frame
extends: elder

desired_velocity: {mean: 0.17, std: 0.02, clip_low: 0.12, clip_high: 0.22}
max_velocity: {mean: 0.25, std: 0.03, clip_low: 0.18, clip_high: 0.32}
agent_radius: {mean: 0.32, std: 0.01, clip_low: 0.3, clip_high: 0.35}
max_acceleration: {mean: 0.3, std: 0.05, clip_low: 0.15, clip_high: 0.5}
max_deceleration: {mean: 0.6, std: 0.1, clip_low: 0.3, clip_high: 1.0}
min_turning_radius: {mean: 0.4, std: 0.05, clip_low: 0.2, clip_high: 0.8}
pivot_angular_velocity: {mean: 0.5, std: 0.1, clip_low: 0.3, clip_high: 0.8}

locomotion:
  cadence: {base: 0.4, per_speed: 0.7536, min: 0.4, max: 2.2}
  phase_warp: {split: 0.5429}
  speed_profile:
    harmonics: [[0.95, -3.08], [0.431, -1.62]]
  lateral_profile:
    harmonics: [[0.259, -0.46], [0.212, 0.54]]
  footprint_length: 0.95

pose:
  # WalkerFitted handle tubes (9 mm); curls solved on the scenario's actor (Hospital/patient_female_asian_old, assistive_1103 grasp_actor.py)
  hold: {l: {radius: 0.009, curls: [0.3, 0.67, 0.82, 0.75, 0.51]}, r: {radius: 0.009, curls: [0.3, 0.67, 0.82, 0.75, 0.51]}}
  walk: {base: walk_walkingframe}
  run: {same_as: walk}
